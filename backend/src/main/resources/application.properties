# --- Application ---
spring.application.name=quickcommerce
server.port=8080

# --- MySQL datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/quickcommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run data.sql (seed data) after Hibernate has created/updated the schema.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
